<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f43">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<script src="pwa.js" defer></script>
<script src="stats.js"></script>
<title>よみがなアタック</title>
<style>
  :root{
    --bg:#f2f1ec;--surface:#ffffff;--surface-2:#faf9f5;
    --text:#232323;--text-dim:#6b6b6b;--line:#e2e0d8;
    --accent:#1f6f43;--accent-press:#185c37;
    --shadow:0 2px 10px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);
    --bad:#d64545;--pick:#c98a1e;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161715;--surface:#22231f;--surface-2:#1c1d1a;
      --text:#ececec;--text-dim:#a0a09a;--line:#33352f;
      --accent:#37b06a;--accent-press:#2c9057;
      --shadow:0 2px 10px rgba(0,0,0,.35),0 10px 34px rgba(0,0,0,.3);
      --bad:#ef6b6b;--pick:#e0a23c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px;}
  .topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em;}
  .topbar .spacer{flex:1;}
  .back-btn,.icon-btn{border:none;background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;flex:none;font-weight:700;text-decoration:none;}
  .back-btn{width:38px;height:38px;font-size:20px;display:flex;align-items:center;justify-content:center;}
  .icon-btn{height:38px;padding:0 14px;font-size:13.5px;display:flex;align-items:center;gap:5px;}
  .back-btn:active,.icon-btn:active{transform:scale(.95);}
  .hud{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:800;white-space:nowrap;}
  .hud .lives{color:var(--bad);}
  .hud .score{color:var(--accent);}

  /* setup */
  .setup{padding:8px 20px 24px;display:flex;flex-direction:column;gap:18px;}
  .howto{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin:0;padding:12px 14px;font-size:12.5px;line-height:1.75;color:var(--text-dim);}
  .howto h3{margin:0 0 5px;font-size:13px;font-weight:800;color:var(--text);}
  .howto p{margin:4px 0;}
  .howto b{color:var(--accent);font-weight:700;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .label{font-size:13px;font-weight:800;color:var(--text-dim);}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--text-dim);padding:9px 0;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}
  .bestline{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-dim);text-align:center;}
  .bestline b{color:var(--accent);font-size:16px;}
  .start-btn{border:none;background:var(--accent);color:#fff;padding:15px 0;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);}
  .start-btn:active{background:var(--accent-press);transform:scale(.98);}

  /* play */
  .play{flex:1;display:flex;flex-direction:column;gap:16px;padding:6px 20px 20px;align-items:center;}
  .arena{
    position:relative;width:100%;max-width:340px;height:210px;background:var(--surface);border-radius:20px;
    box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .arena .term{
    position:relative;font-weight:800;color:var(--text);text-align:center;padding:0 14px;
    font-size:clamp(20px,7.2vw,32px);line-height:1.3;transform:scale(.32);opacity:.5;will-change:transform,opacity;
  }
  .arena .flash{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .15s;
  }
  .arena .flash.show{opacity:1;}
  .arena .flash.ok{color:var(--accent);}
  .arena .flash.ng{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);}
  .arena.shake{animation:shake .35s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-4px);} 20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);}
  }
  .timebar{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);width:100%;}
  .timebar.warn{background:var(--bad);}
  .shard{position:absolute;top:50%;left:50%;width:7px;height:7px;background:var(--bad);border-radius:2px;
    opacity:0;transform:translate(-50%,-50%);}
  .shard.go{animation:shardburst .5s ease-out forwards;}
  @keyframes shardburst{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang)) translateX(95px) scale(.4);}
  }
  .answerbox{display:flex;gap:8px;width:100%;max-width:340px;}
  .answerbox input{
    flex:1;min-width:0;border:none;border-radius:12px;background:var(--surface);color:var(--text);
    box-shadow:inset 0 0 0 2px var(--line);padding:12px 14px;font-size:20px;font-weight:800;
    text-align:center;font-family:inherit;
  }
  .answerbox input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent);}
  .answerbox button{
    flex:none;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;
    font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
  }
  .answerbox button:active{background:var(--accent-press);transform:scale(.96);}
  .hintline{min-height:16px;font-size:12px;color:var(--text-dim);text-align:center;font-weight:700;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:22px;padding:24px 22px;width:100%;max-width:360px;max-height:88vh;overflow-y:auto;text-align:center;box-shadow:var(--shadow);}
  .modal .result{font-size:24px;font-weight:800;margin:0 0 8px;}
  .modal .detail{color:var(--text-dim);font-size:14px;margin:0 0 14px;line-height:1.7;}
  .modal .detail b{color:var(--text);}
  .ovwords{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;text-align:left;}
  .ovwords .wtitle{font-size:12px;font-weight:800;color:var(--text-dim);text-align:center;margin:0 0 2px;}
  .ovwords .wd{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;}
  .ovwords .wd:active{background:var(--surface);}
  .ovwords .wd.miss{box-shadow:inset 3px 0 0 var(--bad);}
  .ovwords .wd .wd-main{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .ovwords .wd .w{font-weight:800;font-size:15px;}
  .ovwords .wd .r{font-size:12px;color:var(--text-dim);font-weight:700;flex:1;}
  .ovwords .wd .infoicon{flex:none;color:var(--text-dim);}
  .ovwords .wd .m{display:none;font-size:12px;color:var(--text-dim);line-height:1.6;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .ovwords .wd.open .m{display:block;}
  .modal .row{display:flex;gap:10px;}
  .modal .row button,.modal .row a{flex:1;border:none;padding:13px;border-radius:13px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;}
  .modal .row .primary{background:var(--accent);color:#fff;}
  .modal .row .ghost{background:var(--line);color:var(--text);}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.84);color:#fff;font-size:13px;font-weight:700;padding:10px 17px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <section id="setup" class="screen active">
    <div class="topbar">
      <a class="back-btn" href="index.html">‹</a>
      <h1>よみがなアタック</h1>
      <span class="spacer"></span>
      <a class="icon-btn" href="rules.html#yomigana">ルール</a>
    </div>
    <div class="setup">
      <div class="howto">
        <h3>遊び方</h3>
        <p>言葉が画面の奥から<b>だんだん迫って</b>きます。大きくなりきる前に、その<b>読み方をひらがなで入力</b>してください。</p>
        <p>1問の制限時間は<b>10秒固定</b>。制限時間内なら何度でも打ち直しOKです。間に合わないと言葉が破裂してミス、残機が0になるとゲームオーバーです。答えるたびに、少しずつ<b>むずかしい言葉</b>が混ざるようになります。</p>
        <p><b>10問正解</b>で1回のクリアです。残機（はじめは3）が0になる前に10問正解を目指しましょう。</p>
      </div>
      <div class="field">
        <span class="label">出題ジャンル</span>
        <div class="seg" id="segGenre">
          <button data-val="mix" class="on">ミックス</button>
          <button data-val="kanji">漢字のみ</button>
          <button data-val="idiom">ことわざ・四字熟語</button>
        </div>
      </div>
      <p class="bestline" id="bestLine">ベストスコア: <b>0</b>問</p>
      <button class="start-btn" id="startBtn">はじめる</button>
    </div>
  </section>

  <section id="play" class="screen">
    <div class="topbar">
      <button class="back-btn" id="toSetup">‹</button>
      <h1>よみがなアタック</h1>
      <span class="spacer"></span>
      <span class="hud"><span class="lives" id="livesLine"></span><span class="score" id="scoreLine"></span></span>
    </div>
    <div class="play">
      <div class="arena" id="arena">
        <span class="term" id="termEl"></span>
        <span class="flash" id="flashEl"></span>
        <span class="timebar" id="timebar"></span>
      </div>
      <div class="answerbox">
        <input id="answerInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="よみをひらがなで">
        <button type="button" id="submitBtn">けってい</button>
      </div>
      <p class="hintline" id="hintLine"></p>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <p class="result" id="ovTitle">ゲームオーバー</p>
    <p class="detail" id="ovDetail"></p>
    <div class="ovwords" id="ovWords"></div>
    <div class="row">
      <a class="ghost" href="index.html">ホーム</a>
      <button class="primary" id="ovRetry">もう一度</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  const $=id=>document.getElementById(id);
  let toastTimer=0;
  function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1500); }
  function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id)); window.scrollTo(0,0); }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  const TIME_LIMIT_MS = 10000;
  const LIVES_START = 3;
  const TARGET_SCORE = 10;

  /* ---------- 設定・記録の保存 ---------- */
  const CFG_KEY="yomigana-cfg";
  function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
  const cfg = Object.assign({genre:"mix"}, lsGet(CFG_KEY)||{});

  /* ---------- ゲーム状態 ---------- */
  const G={ phase:"idle", score:0, lives:LIVES_START, misses:0, timer:0, current:null, usedTerms:new Set(), seenWords:[] };

  /* 正解を重ねるほど読みの長い(=むずかしい)言葉が混ざるようにする。
     TARGET_SCORE(10問)を基準にした割合でしきい値を決め、最後の1問(score>=TARGET_SCORE-1)は
     ネプリーグの最終問題のような「1文字でそんな読み方するの?」枠のULTRA_POOLから必ず出題する。 */
  function kanjiMaxLen(score){
    if(score < TARGET_SCORE*0.2) return 3;
    if(score < TARGET_SCORE*0.4) return 4;
    if(score < TARGET_SCORE*0.6) return 5;
    return 99;
  }
  function idiomMaxLen(score){
    if(score < TARGET_SCORE*0.2) return 6;
    if(score < TARGET_SCORE*0.4) return 7;
    if(score < TARGET_SCORE*0.6) return 9;
    if(score < TARGET_SCORE*0.8) return 12;
    return 99;
  }

  function poolFor(genre, score){
    if(score >= TARGET_SCORE-1) return ULTRA_POOL;
    const kPool = KANJI_POOL.filter(([t,r])=>r.length<=kanjiMaxLen(score));
    const iPool = IDIOM_POOL.filter(([t,r])=>r.length<=idiomMaxLen(score));
    if(genre==="kanji") return kPool.length ? kPool : KANJI_POOL;
    if(genre==="idiom") return iPool.length ? iPool : IDIOM_POOL;
    return kPool.concat(iPool);
  }

  /* 同じゲーム内では出題済みの言葉を除外し、毎回ちがう問題になるようにする */
  function pickProblem(){
    const pool=poolFor(cfg.genre, G.score);
    const candidates=pool.filter(([t])=>!G.usedTerms.has(t));
    const finalPool=candidates.length ? candidates : pool;
    const pick=finalPool[Math.floor(Math.random()*finalPool.length)];
    G.usedTerms.add(pick[0]);
    return {term:pick[0], reading:pick[1], meaning:pick[2]};
  }

  function currentDuration(){
    return TIME_LIMIT_MS;
  }

  function genreRecord(genre){
    const all = window.BGStats ? BGStats.getAll() : {};
    const by = (all.yomigana && all.yomigana.byGenre) || {};
    return by[genre] || {plays:0,clears:0,perfect:0,best:0};
  }

  function renderBestLine(){
    const rec=genreRecord(cfg.genre);
    $("bestLine").innerHTML = "ベストスコア: <b>"+rec.best+" / "+TARGET_SCORE+"</b>問"+
      (rec.clears ? "　クリア回数: <b>"+rec.clears+"</b>回" : "");
  }

  /* ---------- 画面遷移 ---------- */
  function startGame(){
    G.score=0; G.lives=LIVES_START; G.misses=0;
    G.usedTerms.clear(); G.seenWords=[];
    updateHud();
    show("play");
    nextRound();
  }

  function updateHud(){
    $("livesLine").textContent = "のこり "+G.lives;
    $("scoreLine").textContent = G.score+" / "+TARGET_SCORE+"問";
  }

  function nextRound(){
    clearTimeout(G.timer);
    G.phase="playing";
    $("flashEl").className="flash";
    $("arena").classList.remove("shake");
    $("hintLine").textContent="";
    $("answerInput").value="";
    $("answerInput").disabled=false;
    $("answerInput").focus({preventScroll:true});
    G.current = pickProblem();
    const termEl=$("termEl");
    termEl.textContent = G.current.term;
    termEl.style.transition="none";
    termEl.style.transform="scale(.32)";
    termEl.style.opacity=".5";
    const timebar=$("timebar");
    timebar.style.transition="none";
    timebar.style.width="100%";
    timebar.classList.remove("warn");
    const dur=currentDuration();
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        termEl.style.transition="transform "+dur+"ms linear, opacity "+dur+"ms linear";
        termEl.style.transform="scale(1)";
        termEl.style.opacity="1";
        timebar.style.transition="width "+dur+"ms linear";
        timebar.style.width="0%";
        setTimeout(()=>timebar.classList.add("warn"), dur*0.7);
      });
    });
    G.timer=setTimeout(missRound, dur);
  }

  function checkAnswer(){
    if(G.phase!=="playing") return;
    const val=$("answerInput").value.trim();
    if(!val) return;
    if(val===G.current.reading) correctRound();
  }

  function correctRound(){
    if(G.phase!=="playing") return;
    G.phase="result";
    clearTimeout(G.timer);
    $("answerInput").disabled=true;
    const el=$("flashEl"); el.textContent="○ せいかい"; el.className="flash ok show";
    G.seenWords.push({term:G.current.term, reading:G.current.reading, meaning:G.current.meaning, correct:true});
    G.score++;
    updateHud();
    if(G.score>=TARGET_SCORE){
      setTimeout(clearGame, 650);
    }else{
      setTimeout(nextRound, 550);
    }
  }

  function missRound(){
    if(G.phase!=="playing") return;
    G.phase="result";
    $("answerInput").disabled=true;
    $("arena").classList.add("shake");
    burstShards();
    const el=$("flashEl"); el.textContent="× ばくはつ"; el.className="flash ng show";
    $("hintLine").textContent="正解: "+G.current.term+"（"+G.current.reading+"）";
    G.seenWords.push({term:G.current.term, reading:G.current.reading, meaning:G.current.meaning, correct:false});
    G.lives--;
    G.misses++;
    updateHud();
    if(G.lives<=0){
      setTimeout(endGame, 750);
    }else{
      setTimeout(nextRound, 1100);
    }
  }

  function burstShards(){
    const arena=$("arena");
    const n=10;
    for(let i=0;i<n;i++){
      const s=document.createElement("span");
      s.className="shard";
      s.style.setProperty("--ang",(360/n*i)+"deg");
      arena.appendChild(s);
      requestAnimationFrame(()=>s.classList.add("go"));
      setTimeout(()=>s.remove(), 550);
    }
  }

  /* ゲーム終了時に、出てきた言葉を一覧表示する(タップで意味を開閉) */
  function renderSeenWords(){
    const wrap=$("ovWords");
    if(!G.seenWords.length){ wrap.innerHTML=""; return; }
    wrap.innerHTML =
      '<p class="wtitle">出てきた言葉(タップで意味)</p>' +
      G.seenWords.map(w=>
        '<div class="wd'+(w.correct?'':' miss')+'"><div class="wd-main"><span class="w">'+esc(w.term)+'</span><span class="r">'+esc(w.reading)+'</span>'+
        '<svg class="infoicon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
        '<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor" stroke="none"/></svg></div>'+
        '<div class="m">'+esc(w.meaning||"")+'</div></div>'
      ).join("");
  }

  function endGame(){
    clearTimeout(G.timer);
    G.phase="over";
    let isBest=false;
    if(window.BGStats){
      BGStats.record("yomigana", cur=>{
        cur.plays=(cur.plays||0)+1;
        cur.byGenre=cur.byGenre||{};
        const rec=cur.byGenre[cfg.genre]=cur.byGenre[cfg.genre]||{plays:0,clears:0,perfect:0,best:0};
        rec.plays++;
        if(G.score>rec.best){ rec.best=G.score; isBest=true; }
      });
    }
    $("ovTitle").textContent="ゲームオーバー";
    $("ovDetail").innerHTML = "今回のスコア: <b>"+G.score+" / "+TARGET_SCORE+"問</b>"+(isBest?"<br>ベスト記録を更新しました！":"");
    renderSeenWords();
    $("overlay").classList.add("show");
  }

  function clearGame(){
    clearTimeout(G.timer);
    G.phase="over";
    const perfect = G.misses===0;
    if(window.BGStats){
      BGStats.record("yomigana", cur=>{
        cur.plays=(cur.plays||0)+1;
        cur.byGenre=cur.byGenre||{};
        const rec=cur.byGenre[cfg.genre]=cur.byGenre[cfg.genre]||{plays:0,clears:0,perfect:0,best:0};
        rec.plays++; rec.clears++;
        if(perfect) rec.perfect++;
        rec.best=TARGET_SCORE;
      });
    }
    $("ovTitle").textContent="クリア！";
    $("ovDetail").innerHTML = "見事"+TARGET_SCORE+"問正解！"+(perfect?"<br>ノーミスクリアです！":"<br>まちがえた回数: "+G.misses);
    renderSeenWords();
    $("overlay").classList.add("show");
  }

  /* ---------- イベント ---------- */
  $("submitBtn").addEventListener("click",checkAnswer);
  $("answerInput").addEventListener("input",e=>{
    if(e.isComposing) return;
    checkAnswer();
  });
  $("answerInput").addEventListener("compositionend",checkAnswer);
  $("answerInput").addEventListener("keydown",e=>{
    if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); checkAnswer(); }
  });
  $("toSetup").addEventListener("click",()=>{
    clearTimeout(G.timer);
    G.phase="idle";
    $("overlay").classList.remove("show");
    renderBestLine();
    show("setup");
  });
  $("ovRetry").addEventListener("click",()=>{
    $("overlay").classList.remove("show");
    startGame();
  });
  $("ovWords").addEventListener("click",e=>{
    const wd=e.target.closest(".wd"); if(!wd) return;
    wd.classList.toggle("open");
  });
  $("startBtn").addEventListener("click",startGame);

  function seg(id,key){
    const wrap=$(id);
    wrap.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.val===cfg[key]));
    wrap.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      cfg[key]=b.dataset.val; lsSet(CFG_KEY,cfg);
      wrap.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
      if(key==="genre") renderBestLine();
    });
  }
  seg("segGenre","genre");

  renderBestLine();
})();
</script>
</body>
</html>
