<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f43">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<script src="pwa.js" defer></script>
<script src="stats.js"></script>
<title>記録</title>
<style>
  :root{
    --bg:#f2f1ec;--surface:#ffffff;--surface-2:#faf9f5;
    --text:#232323;--text-dim:#6b6b6b;--line:#e2e0d8;
    --accent:#1f6f43;--accent-press:#185c37;
    --shadow:0 2px 10px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);
    --gold:#c98a1e;--bad:#c0503f;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161715;--surface:#22231f;--surface-2:#1c1d1a;
      --text:#ececec;--text-dim:#a0a09a;--line:#33352f;
      --accent:#37b06a;--accent-press:#2c9057;
      --shadow:0 2px 10px rgba(0,0,0,.35),0 10px 34px rgba(0,0,0,.3);
      --gold:#e0a23c;--bad:#e0776a;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:480px;margin:0 auto;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px;}
  .topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em;}
  .back-btn{
    width:38px;height:38px;border:none;background:var(--surface);color:var(--text);border-radius:12px;
    box-shadow:var(--shadow);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;flex:none;
  }
  .back-btn:active{transform:scale(.95);}

  .lead{padding:2px 20px 14px;color:var(--text-dim);font-size:13px;line-height:1.6;}

  .stat-card{background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin:0 16px 14px;}
  .stat-card h2{margin:0 0 10px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .stat-card h2 .ic{width:21px;height:21px;color:var(--accent);flex:none;display:flex;}
  .stat-card h2 .ic svg{width:21px;height:21px;}
  .stat-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);}
  .stat-row:first-of-type{border-top:none;}
  .stat-row .k{color:var(--text-dim);}
  .stat-row .v{font-weight:800;text-align:right;}
  .stat-row .v.hi{color:var(--gold);}
  .stat-row .v.lo{color:var(--bad);}
  .stat-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:14px 0 4px;margin:0;}

  .reset-row{text-align:center;padding:10px 16px 30px;}
  .reset-btn{border:none;background:none;color:var(--text-dim);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:10px;}
  .reset-btn:active{opacity:.6;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back-btn" href="index.html">‹</a>
    <h1>記録</h1>
  </div>
  <p class="lead">この端末に保存されている、各ゲームのプレイ回数・成績です。</p>
  <div id="cards"></div>
  <div class="reset-row"><button class="reset-btn" id="resetAll">記録をすべてリセット</button></div>
</div>

<script>
"use strict";
(function(){
  const $=id=>document.getElementById(id);

  function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function row(k,v,cls){ return '<div class="stat-row"><span class="k">'+esc(k)+'</span><span class="v'+(cls?" "+cls:"")+'">'+v+'</span></div>'; }
  function pct(a,b){ return b ? Math.round(a/b*100)+"%" : "—"; }
  function fmtTime(ms){
    if(ms==null) return "—";
    const s=Math.floor(ms/1000);
    return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  function card(title, icSvg, bodyHtml){
    return '<div class="stat-card"><h2><span class="ic">'+icSvg+'</span>'+esc(title)+'</h2>'+bodyHtml+'</div>';
  }
  const empty = '<p class="stat-empty">まだ記録がありません</p>';

  const IC = {
    othello:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4.2"/></svg>',
    daifugo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14" y="2" width="7" height="17" rx="1.5"/></svg>',
    babanuki:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/><path d="M16 9.5a1.6 1.6 0 1 1 2.4 1.4c-1 .6-1.4 1.1-1.4 2.1"/><circle cx="17.4" cy="16" r=".2" fill="currentColor" stroke-width="1.2"/></svg>',
    sevens:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="6" height="12" rx="1.3"/><rect x="9" y="6" width="6" height="12" rx="1.3"/><rect x="16" y="6" width="6" height="12" rx="1.3"/></svg>',
    memory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.3"/><rect x="13" y="3" width="8" height="8" rx="1.3"/><rect x="3" y="13" width="8" height="8" rx="1.3"/><rect x="13" y="13" width="8" height="8" rx="1.3"/></svg>',
    solitaire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="6" height="15" rx="1.3"/><rect x="9.5" y="5" width="6" height="10" rx="1.3"/><rect x="17" y="5" width="6" height="6" rx="1.3"/></svg>',
    sudoku:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>'
  };

  function othelloCard(s){
    if(!s || !s.plays) return card("オセロ", IC.othello, empty);
    return card("オセロ", IC.othello,
      row("プレイ回数（CPU戦）", s.plays+"回")+
      row("勝ち", (s.wins||0)+"回", "hi")+
      row("負け", (s.losses||0)+"回", (s.losses?"lo":""))+
      row("引き分け", (s.draws||0)+"回")+
      row("勝率", pct(s.wins||0, s.plays))
    );
  }

  function daifugoCard(s){
    if(!s || !s.plays) return card("大富豪", IC.daifugo, empty);
    const ranks=s.ranks||{};
    const keys=Object.keys(ranks).map(Number).sort((a,b)=>a-b);
    const rankLine = keys.map(k=>k+"位 "+ranks[k]+"回").join(" ／ ");
    return card("大富豪", IC.daifugo,
      row("プレイ回数", s.plays+"回")+
      row("富豪になった回数（1位）", (s.daifugoCount||0)+"回", "hi")+
      row("大貧民になった回数（最下位）", (s.daihinminCount||0)+"回", (s.daihinminCount?"lo":""))+
      row("反則あがり", (s.fouls||0)+"回")+
      (rankLine ? '<div class="stat-row"><span class="k">着順の内訳</span><span class="v" style="font-weight:700;font-size:12px">'+esc(rankLine)+'</span></div>' : "")
    );
  }

  function babanukiCard(s){
    if(!s || !s.plays) return card("ババ抜き", IC.babanuki, empty);
    return card("ババ抜き", IC.babanuki,
      row("プレイ回数", s.plays+"回")+
      row("勝ち（抜け出せた）", (s.wins||0)+"回", "hi")+
      row("負け（ババを引いた）", (s.losses||0)+"回", (s.losses?"lo":""))+
      row("勝率", pct(s.wins||0, s.plays))
    );
  }

  function sevensCard(s){
    if(!s || !s.plays) return card("七並べ", IC.sevens, empty);
    const ranks=s.ranks||{};
    const keys=Object.keys(ranks).map(Number).sort((a,b)=>a-b);
    const rankLine = keys.map(k=>k+"位 "+ranks[k]+"回").join(" ／ ");
    return card("七並べ", IC.sevens,
      row("プレイ回数", s.plays+"回")+
      row("1位になった回数", (s.wins||0)+"回", "hi")+
      row("最下位になった回数", (s.losses||0)+"回", (s.losses?"lo":""))+
      (rankLine ? '<div class="stat-row"><span class="k">着順の内訳</span><span class="v" style="font-weight:700;font-size:12px">'+esc(rankLine)+'</span></div>' : "")
    );
  }

  function memoryCard(s){
    if(!s || !s.plays) return card("神経衰弱", IC.memory, empty);
    return card("神経衰弱", IC.memory,
      row("プレイ回数", s.plays+"回")+
      row("勝ち", (s.wins||0)+"回", "hi")+
      row("負け", (s.losses||0)+"回", (s.losses?"lo":""))+
      row("引き分け", (s.draws||0)+"回")+
      row("勝率", pct(s.wins||0, s.plays))
    );
  }

  function solitaireCard(s){
    if(!s || !s.plays) return card("ソリティア", IC.solitaire, empty);
    return card("ソリティア", IC.solitaire,
      row("プレイ回数", s.plays+"回")+
      row("クリア回数", (s.clears||0)+"回", "hi")+
      row("クリア率", pct(s.clears||0, s.plays))+
      row("ベストタイム", fmtTime(s.bestTimeMs))
    );
  }

  function sudokuCard(s){
    if(!s || !s.plays) return card("ナンプレ", IC.sudoku, empty);
    const LV={easy:"やさしい",normal:"ふつう",hard:"むずかしい",oni:"おに"};
    const by=s.byLevel||{};
    let lvHtml="";
    ["easy","normal","hard","oni"].forEach(k=>{
      const v=by[k]; if(!v || !v.plays) return;
      lvHtml += row(LV[k]+"（プレイ "+v.plays+"／クリア "+(v.clears||0)+"）", fmtTime(v.bestTimeMs));
    });
    return card("ナンプレ", IC.sudoku,
      row("プレイ回数", s.plays+"回")+
      row("クリア回数", (s.clears||0)+"回", "hi")+
      row("クリア率", pct(s.clears||0, s.plays))+
      lvHtml
    );
  }

  function render(){
    const all = window.BGStats ? BGStats.getAll() : {};
    $("cards").innerHTML =
      othelloCard(all.othello)+
      daifugoCard(all.daifugo)+
      babanukiCard(all.babanuki)+
      sevensCard(all.sevens)+
      memoryCard(all.memory)+
      solitaireCard(all.solitaire)+
      sudokuCard(all.sudoku);
  }
  render();

  $("resetAll").addEventListener("click",()=>{
    if(!window.BGStats) return;
    if(!confirm("すべてのゲームの記録を消去します。よろしいですか？")) return;
    BGStats.resetAll();
    render();
  });
})();
</script>
</body>
</html>
