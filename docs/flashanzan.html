<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f43">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<script src="pwa.js" defer></script>
<script src="stats.js"></script>
<title>フラッシュ暗算</title>
<style>
  :root{
    --bg:#f2f1ec;--surface:#ffffff;--surface-2:#faf9f5;
    --text:#232323;--text-dim:#6b6b6b;--line:#e2e0d8;
    --accent:#1f6f43;--accent-press:#185c37;
    --shadow:0 2px 10px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06);
    --bad:#d64545;--pick:#c98a1e;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161715;--surface:#22231f;--surface-2:#1c1d1a;
      --text:#ececec;--text-dim:#a0a09a;--line:#33352f;
      --accent:#37b06a;--accent-press:#2c9057;
      --shadow:0 2px 10px rgba(0,0,0,.35),0 10px 34px rgba(0,0,0,.3);
      --bad:#ef6b6b;--pick:#e0a23c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px;}
  .topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em;}
  .topbar .spacer{flex:1;}
  .back-btn,.icon-btn{border:none;background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;flex:none;font-weight:700;text-decoration:none;}
  .back-btn{width:38px;height:38px;font-size:20px;display:flex;align-items:center;justify-content:center;}
  .icon-btn{height:38px;padding:0 14px;font-size:13.5px;display:flex;align-items:center;gap:5px;}
  .back-btn:active,.icon-btn:active{transform:scale(.95);}
  .topbar .streak{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;}

  /* setup */
  .setup{padding:8px 20px 24px;display:flex;flex-direction:column;gap:18px;}
  .howto{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin:0;padding:12px 14px;font-size:12.5px;line-height:1.75;color:var(--text-dim);}
  .howto h3{margin:0 0 5px;font-size:13px;font-weight:800;color:var(--text);}
  .howto p{margin:4px 0;}
  .howto b{color:var(--accent);font-weight:700;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .label{font-size:13px;font-weight:800;color:var(--text-dim);}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--text-dim);padding:9px 0;border-radius:9px;font-weight:800;font-size:13.5px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}
  .lvlist{display:flex;flex-direction:column;gap:10px;}
  .lvcard{
    position:relative;display:flex;align-items:center;gap:12px;text-align:left;
    border:2px solid var(--line);background:var(--surface);color:var(--text);
    padding:12px 16px;border-radius:16px;cursor:pointer;font:inherit;box-shadow:var(--shadow);
  }
  .lvcard:active{transform:scale(.98);}
  .lvcard .pnum{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .lvcard.mixed .pnum{background:var(--accent);color:#fff;}
  .lvcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .lvcard .nm{font-weight:800;font-size:15px;}
  .lvcard .nm .tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:var(--pick);
    background:color-mix(in srgb,var(--pick) 14%,transparent);border-radius:999px;padding:2px 7px;vertical-align:middle;}
  .lvcard .sub{font-size:11.5px;color:var(--text-dim);font-weight:700;}
  .lvcard .best{font-size:12px;color:var(--accent);font-weight:800;flex:none;text-align:right;white-space:nowrap;}

  /* play */
  .play{flex:1;display:flex;flex-direction:column;gap:16px;padding:6px 20px 20px;align-items:center;}
  .numbox{
    width:100%;max-width:320px;min-height:150px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:min(18vw,64px);font-weight:800;color:var(--text);
    padding:10px;text-align:center;line-height:1.15;
  }
  .numbox.flashing{color:var(--accent);}
  .numbox.wrong{color:var(--bad);}
  .numbox.msg{font-size:26px;}
  .progress{font-size:12px;color:var(--text-dim);font-weight:700;min-height:16px;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px;}
  .keypad button{border:none;background:var(--surface);color:var(--text);border-radius:14px;padding:16px 0;
    font-size:20px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;}
  .keypad button:active{transform:scale(.94);background:var(--surface-2);}
  .keypad button.ok{background:var(--accent);color:#fff;}
  .keypad button.ok:active{background:var(--accent-press);}
  .keypad button.del{color:var(--text-dim);}
  .resultline{width:100%;max-width:320px;font-size:14px;color:var(--text-dim);text-align:center;line-height:1.7;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:none;}
  .resultline.show{display:block;}
  .resultline b{color:var(--text);font-weight:800;}
  .tapline{min-height:16px;font-size:11.5px;color:var(--text-dim);text-align:center;margin:0;}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.84);color:#fff;font-size:13px;font-weight:700;padding:10px 17px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:80%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <section id="setup" class="screen active">
    <div class="topbar">
      <a class="back-btn" href="index.html">‹</a>
      <h1>フラッシュ暗算</h1>
      <span class="spacer"></span>
      <a class="icon-btn" href="rules.html#flashanzan">ルール</a>
    </div>
    <div class="setup">
      <div class="howto">
        <h3>遊び方</h3>
        <p>画面に数字が1つずつパッと表示されて消えていきます。全部見終わったら、頭の中で<b>合計を計算</b>して答えを入力してください。</p>
        <p>連続正解を続けると<b>連続記録</b>が伸びます。まちがえると記録はリセットされますが、答え合わせで正しい式を確認できます。</p>
      </div>
      <div class="field">
        <span class="label">表示スピード</span>
        <div class="seg" id="segSpeed">
          <button data-val="slow">ゆっくり</button>
          <button data-val="normal" class="on">ふつう</button>
          <button data-val="fast">はやい</button>
        </div>
      </div>
      <div class="field">
        <span class="label">レベルを選ぶ</span>
        <div class="lvlist" id="lvList"></div>
      </div>
    </div>
  </section>

  <section id="play" class="screen">
    <div class="topbar">
      <button class="back-btn" id="toSetup">‹</button>
      <h1 id="playTitle">フラッシュ暗算</h1>
      <span class="spacer"></span>
      <span class="streak" id="streakLine"></span>
    </div>
    <div class="play">
      <div class="numbox" id="numbox">3</div>
      <p class="progress" id="progressLine"></p>
      <div class="keypad" id="keypad" style="display:none">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="del" data-k="del">⌫</button><button data-k="0">0</button><button class="ok" data-k="ok">けってい</button>
      </div>
      <div class="resultline" id="resultLine"></div>
      <p class="tapline" id="tapLine"></p>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  const $=id=>document.getElementById(id);
  let toastTimer=0;
  function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1500); }
  function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id)); window.scrollTo(0,0); }

  const GAP_MS=140;
  const SPEED_MULT={slow:1.4, normal:1.0, fast:0.7};

  const LEVELS=[
    {id:1,  digits:1, count:3,  ms:1400, mixed:false},
    {id:2,  digits:1, count:5,  ms:1200, mixed:false},
    {id:3,  digits:1, count:7,  ms:1000, mixed:false},
    {id:4,  digits:2, count:5,  ms:1000, mixed:false},
    {id:5,  digits:2, count:7,  ms:900,  mixed:false},
    {id:6,  digits:2, count:10, ms:800,  mixed:false},
    {id:7,  digits:1, count:7,  ms:800,  mixed:true},
    {id:8,  digits:2, count:7,  ms:700,  mixed:true},
    {id:9,  digits:2, count:10, ms:600,  mixed:true},
    {id:10, digits:2, count:15, ms:500,  mixed:true}
  ];

  /* ---------- 設定の保存 ---------- */
  const SPEED_KEY="flashanzan-speed";
  function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
  let speedKey = lsGet(SPEED_KEY) || "normal";

  /* ---------- ゲーム状態 ---------- */
  const G={ level:null, problem:null, input:"", phase:"idle", streak:0, timers:[] };

  function clearTimers(){ G.timers.forEach(t=>clearTimeout(t)); G.timers=[]; }
  function setT(fn,ms){ const t=setTimeout(fn,ms); G.timers.push(t); return t; }

  function levelDesc(lv){
    const d=lv.digits===1?"1桁":"2桁";
    return d+"×"+lv.count+"口"+(lv.mixed?"（加減算）":"（たし算）");
  }

  function renderLevelList(){
    const wrap=$("lvList"); wrap.innerHTML="";
    const all = window.BGStats ? BGStats.getAll() : {};
    const by = (all.flashanzan && all.flashanzan.byLevel) || {};
    LEVELS.forEach(lv=>{
      const rec=by[lv.id];
      const b=document.createElement("button");
      b.type="button"; b.className="lvcard"+(lv.mixed?" mixed":"");
      b.innerHTML=
        '<span class="pnum">'+lv.id+'</span>'+
        '<span class="body"><span class="nm">Lv.'+lv.id+(lv.mixed?'<span class="tag">加減算</span>':'')+'</span>'+
        '<span class="sub">'+levelDesc(lv)+'</span></span>'+
        (rec && rec.bestStreak ? '<span class="best">ベスト<br>'+rec.bestStreak+'問</span>' : '');
      b.addEventListener("click",()=>startLevel(lv.id));
      wrap.appendChild(b);
    });
  }

  function findLevel(id){ return LEVELS.find(l=>l.id===id); }

  function startLevel(id){
    G.level=findLevel(id);
    G.streak=0;
    updateStreakLine();
    $("playTitle").textContent="フラッシュ暗算 Lv."+id;
    show("play");
    nextProblem(true);
  }

  function updateStreakLine(){
    $("streakLine").textContent = G.streak>0 ? "連続 "+G.streak+"問" : "";
  }

  /* ---------- 問題の生成 ---------- */
  function genProblem(lv){
    const min = lv.digits===1 ? 1 : 10;
    const max = lv.digits===1 ? 9 : 99;
    const nums=[], ops=[];
    let total=0;
    for(let i=0;i<lv.count;i++){
      let op="+";
      if(i>0 && lv.mixed && Math.random()<0.5) op="-";
      let n;
      if(op==="-"){
        const capMax=Math.min(max,total);
        if(capMax<min){ op="+"; n=min+Math.floor(Math.random()*(max-min+1)); }
        else{ n=min+Math.floor(Math.random()*(capMax-min+1)); }
      }else{
        n=min+Math.floor(Math.random()*(max-min+1));
      }
      nums.push(n); ops.push(op);
      total += (op==="-" ? -n : n);
    }
    return {nums,ops,total};
  }

  function exprText(problem){
    return problem.nums.map((n,i)=>{
      if(i===0) return String(n);
      return (problem.ops[i]==="-" ? " － " : " ＋ ")+n;
    }).join("") + " ＝ " + problem.total;
  }

  /* ---------- 出題フロー ---------- */
  function nextProblem(withCountdown){
    clearTimers();
    G.phase="flash";
    G.input="";
    $("keypad").style.display="none";
    $("resultLine").classList.remove("show");
    $("tapLine").textContent="";
    $("progressLine").textContent="";
    const box=$("numbox");
    box.classList.remove("wrong"); box.classList.remove("flashing"); box.classList.remove("msg");
    G.problem=genProblem(G.level);
    if(withCountdown){
      let n=3;
      box.textContent=n;
      const tick=()=>{
        n--;
        if(n>0){ box.textContent=n; setT(tick,600); }
        else{ box.classList.add("msg"); box.textContent="スタート"; setT(()=>playSequence(), 500); }
      };
      setT(tick,600);
    }else{
      setT(()=>playSequence(), 350);
    }
  }

  function playSequence(){
    const lv=G.level, problem=G.problem, box=$("numbox");
    const mult=SPEED_MULT[speedKey]||1;
    let i=0;
    function step(){
      if(i>=problem.nums.length){ startInput(); return; }
      $("progressLine").textContent=(i+1)+" / "+problem.nums.length;
      const sign = i===0 ? "" : (problem.ops[i]==="-" ? "－" : "＋");
      box.classList.remove("msg");
      box.textContent=sign+problem.nums[i];
      box.classList.add("flashing");
      setT(()=>{
        box.textContent="";
        box.classList.remove("flashing");
        setT(()=>{ i++; step(); }, GAP_MS);
      }, Math.round(lv.ms*mult));
    }
    step();
  }

  function startInput(){
    G.phase="input";
    $("progressLine").textContent="";
    const box=$("numbox");
    box.classList.remove("msg");
    box.textContent="？";
    $("keypad").style.display="grid";
  }

  function pressKey(k){
    if(G.phase!=="input") return;
    if(k==="del"){ G.input=G.input.slice(0,-1); }
    else if(k==="ok"){ submitAnswer(); return; }
    else{ if(G.input.length<6) G.input+=k; }
    $("numbox").textContent = G.input || "？";
  }

  function submitAnswer(){
    if(G.phase!=="input") return;
    if(G.input==="") return;
    const ans=parseInt(G.input,10);
    const correct = ans===G.problem.total;
    G.phase="result";
    $("keypad").style.display="none";
    const box=$("numbox");
    box.classList.add("msg");
    if(correct){
      G.streak++;
      box.classList.remove("wrong");
      box.textContent="○ せいかい！";
      toast("せいかい！");
    }else{
      G.streak=0;
      box.classList.add("wrong");
      box.textContent="× ざんねん";
      toast("ざんねん…");
    }
    updateStreakLine();
    const rl=$("resultLine");
    rl.innerHTML = "式：<b>"+exprText(G.problem)+"</b>"+(correct?"":"<br>あなたの答え："+ans);
    rl.classList.add("show");
    $("tapLine").textContent="画面をタップして次の問題へ";
    if(window.BGStats){
      const lv=G.level;
      BGStats.record("flashanzan", cur=>{
        cur.plays=(cur.plays||0)+1;
        if(correct) cur.clears=(cur.clears||0)+1;
        cur.byLevel=cur.byLevel||{};
        const rec=cur.byLevel[lv.id]=cur.byLevel[lv.id]||{plays:0,clears:0,bestStreak:0};
        rec.plays++; if(correct) rec.clears++;
        if(G.streak>rec.bestStreak) rec.bestStreak=G.streak;
      });
    }
  }

  /* ---------- イベント ---------- */
  $("keypad").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    pressKey(b.dataset.k);
  });
  document.addEventListener("keydown",e=>{
    if(!$("play").classList.contains("active") || G.phase!=="input") return;
    if(e.key>="0" && e.key<="9"){ pressKey(e.key); }
    else if(e.key==="Backspace"){ pressKey("del"); }
    else if(e.key==="Enter"){ pressKey("ok"); }
  });
  $("play").addEventListener("click",e=>{
    if(G.phase==="result" && !e.target.closest(".keypad")){
      nextProblem(false);
    }
  });
  $("toSetup").addEventListener("click",()=>{
    clearTimers();
    G.phase="idle";
    renderLevelList();
    show("setup");
  });

  (function segSpeed(){
    const wrap=$("segSpeed");
    wrap.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.val===speedKey));
    wrap.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      speedKey=b.dataset.val; lsSet(SPEED_KEY,speedKey);
      wrap.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    });
  })();

  renderLevelList();
})();
</script>
</body>
</html>
